<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Emberwing Knights — world test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; color: #fff; background: rgba(10, 8, 20, 0.55); padding: 6px 9px; border-radius: 6px; pointer-events: none; white-space: pre; }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { World } from '../src/gfx/world.js';
import { toonMaterial, outlineAll, setToonResolution } from '../src/gfx/toon.js';
import { SAMPLE_MAPS } from './sample-maps.js';

const P = new URLSearchParams(location.search);
const mapDef = structuredClone(SAMPLE_MAPS[P.get('map') || '1'] || SAMPLE_MAPS[1]);
if (P.get('env')) mapDef.environment = P.get('env');
if (P.get('border')) mapDef.border = P.get('border');
if (P.get('palette')) mapDef.palette = P.get('palette');
const camMode = P.get('cam') || 'game';
const quality = P.get('q') || 'high';

// lighting presets mirroring the game's environments
const ENV = {
  dawn:     { bg: 0xf2c9b4, fog: 0xeac3b2, density: 0.016, sky: 0xffd9c2, ground: 0x6a5a6a, hemi: 1.05, sun: 0xffc49a, sunI: 2.3, dir: [-0.62, 0.5, 0.6] },
  day:      { bg: 0xa9d2f2, fog: 0xbcdaf0, density: 0.014, sky: 0xd8ecff, ground: 0x6b5a48, hemi: 1.15, sun: 0xfff1d6, sunI: 2.7, dir: [0.42, 0.78, 0.46] },
  sunset:   { bg: 0xf3a77a, fog: 0xe9a07e, density: 0.018, sky: 0xffc39a, ground: 0x5a4060, hemi: 0.95, sun: 0xff9a5a, sunI: 2.3, dir: [-0.8, 0.42, 0.42] },
  night:    { bg: 0x121831, fog: 0x18203e, density: 0.02, sky: 0x5a6a9e, ground: 0x1c1a2a, hemi: 0.75, sun: 0xb4c2f0, sunI: 0.7, dir: [0.35, 0.8, -0.48] },
  desert:   { bg: 0xf0dcb0, fog: 0xefd8ad, density: 0.015, sky: 0xfff0d0, ground: 0x9a7a52, hemi: 1.1, sun: 0xfff0c8, sunI: 2.7, dir: [0.55, 0.75, 0.36] },
  volcano:  { bg: 0x3a1f1c, fog: 0x4a2620, density: 0.022, sky: 0xc46a4a, ground: 0x2a1512, hemi: 0.85, sun: 0xff9b6a, sunI: 1.6, dir: [-0.5, 0.7, 0.5] },
  twilight: { bg: 0x4a3f78, fog: 0x584b80, density: 0.018, sky: 0x9a88d0, ground: 0x2a2236, hemi: 0.85, sun: 0xc8a8ff, sunI: 1.3, dir: [-0.6, 0.55, -0.55] },
};
const E = ENV[mapDef.environment] || ENV.day;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
setToonResolution(innerWidth, innerHeight, renderer.getPixelRatio());

const scene = new THREE.Scene();
scene.background = new THREE.Color(E.bg);
scene.fog = new THREE.FogExp2(E.fog, E.density);

const t0 = performance.now();
const world = new World(mapDef, { quality });
const buildMs = performance.now() - t0;
scene.add(world.group);
window.__world = world;
if (P.has('bench')) {
  const res = {};
  for (const k of Object.keys(SAMPLE_MAPS)) {
    const times = [];
    for (let i = 0; i < 6; i++) {
      const s = performance.now();
      const w = new World(SAMPLE_MAPS[k], { quality });
      times.push(+(performance.now() - s).toFixed(1));
      w.dispose();
    }
    const sorted = times.slice(1).sort((a, b) => a - b);
    res[SAMPLE_MAPS[k].id] = { first: times[0], median: sorted[Math.floor(sorted.length / 2)], min: sorted[0] };
  }
  console.log('BENCH ' + JSON.stringify({ quality, coldFirstPageBuildMs: +buildMs.toFixed(1), coldPhases: world.stats.phases, maps: res }));
}

const W = world.width, H = world.height;
const center = new THREE.Vector3(W / 2, 0.4, H / 2);

const hemi = new THREE.HemisphereLight(E.sky, E.ground, E.hemi);
scene.add(hemi);
const sun = new THREE.DirectionalLight(E.sun, E.sunI);
const sunDir = new THREE.Vector3(...E.dir).normalize();
sun.position.copy(center).addScaledVector(sunDir, 40);
sun.target.position.copy(center);
sun.castShadow = true;
sun.shadow.mapSize.set(quality === 'low' ? 1024 : 2048, quality === 'low' ? 1024 : 2048);
const half = Math.max(W, H) * 0.5 + (camMode === 'far' ? 10 : 5);
Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, near: 1, far: 90 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// ---------------------------------------------------------------- camera
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 400);
const FOCUS = { 1: [10, 8], 2: [9, 4], 3: [13, 4] }[P.get('map') || '1'] || [W / 2, H / 2];
let tx, ty;
if (P.has('x') || camMode !== 'game') { tx = (P.has('x') ? +P.get('x') : FOCUS[0]) + 0.5; ty = (P.has('y') ? +P.get('y') : FOCUS[1]) + 0.5; }
else { tx = W / 2; ty = H / 2; }
const target = new THREE.Vector3(tx, world.tileTop(Math.floor(tx), Math.floor(ty)), ty);
const CAMS = {
  game: { fov: 30, dist: 20, pitch: 52, yaw: 45 },
  close: { fov: 34, dist: 8.5, pitch: 17, yaw: 32 },
  far: { fov: 30, dist: 56, pitch: 50, yaw: 45 },
  top: { fov: 30, dist: 44, pitch: 85, yaw: 0 },
};
const C = { ...CAMS[camMode] || CAMS.game };
if (P.has('yaw')) C.yaw = +P.get('yaw');
if (P.has('pitch')) C.pitch = +P.get('pitch');
if (P.has('dist')) C.dist = +P.get('dist');
camera.fov = C.fov;
const pr = THREE.MathUtils.degToRad(C.pitch), yr = THREE.MathUtils.degToRad(C.yaw);
camera.position.copy(target).add(new THREE.Vector3(Math.sin(yr) * Math.cos(pr), Math.sin(pr), Math.cos(yr) * Math.cos(pr)).multiplyScalar(C.dist));
camera.lookAt(target);
camera.updateProjectionMatrix();

// ---------------------------------------------------------------- stand-in chibi units + highlights
const UNIT_TILES = {
  1: [[12, 8, 0x3d6fd8], [1, 3, 0x3d6fd8], [7, 8, 0x3d6fd8], [16, 11, 0xd8443d], [6, 3, 0xd8443d], [14, 2, 0xd8443d]],
  2: [[9, 1, 0xd8443d], [9, 7, 0x3d6fd8], [9, 4, 0xd8443d], [5, 4, 0x3d6fd8], [12, 10, 0x3d6fd8], [2, 2, 0xd8443d]],
  3: [[14, 3, 0xd8443d], [8, 11, 0x3d6fd8], [13, 2, 0xd8443d], [3, 6, 0x3d6fd8], [18, 5, 0x3d6fd8]],
}[P.get('map') || '1'] || [];
const units = new THREE.Group();
if (P.get('units') !== '0') {
  for (const [x, y, col] of UNIT_TILES) {
    const u = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.3, 4, 12), toonMaterial({ color: col }));
    body.position.y = 0.32;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 14), toonMaterial({ color: 0xf6d3b9 }));
    head.position.y = 0.73;
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.225, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), toonMaterial({ color: col === 0x3d6fd8 ? 0xcf3b25 : 0x2a2a3a }));
    hair.position.y = 0.75;
    for (const m of [body, head, hair]) { m.castShadow = true; u.add(m); }
    outlineAll(u, { width: 2.2 });
    world.tileCenter(x, y, u.position);
    u.rotation.y = Math.PI / 4;
    units.add(u);
  }
}
scene.add(units);

const hlMat = new THREE.MeshBasicMaterial({ color: 0x4aa0ff, transparent: true, opacity: 0.38, depthWrite: false });
const hlGeo = new THREE.PlaneGeometry(0.94, 0.94).rotateX(-Math.PI / 2);
if (P.get('hl') === '1' && UNIT_TILES.length) {
  const [ux, uy] = UNIT_TILES[0];
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    const x = ux + dx, y = uy + dy;
    if (Math.abs(dx) + Math.abs(dy) > 3 || x < 0 || y < 0 || x >= W || y >= H) continue;
    const q = new THREE.Mesh(hlGeo, hlMat);
    world.tileCenter(x, y, q.position);
    q.position.y += 0.01;
    q.renderOrder = 5;
    scene.add(q);
  }
}
const hover = new THREE.Mesh(hlGeo, new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.55, depthWrite: false }));
hover.visible = false;
hover.renderOrder = 6;
scene.add(hover);
const ray = new THREE.Raycaster();
const pickAt = (px, py) => {
  ray.setFromCamera(new THREE.Vector2((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1), camera);
  const t = world.pick(ray);
  hover.visible = !!t;
  if (t) { world.tileCenter(t.x, t.y, hover.position); hover.position.y += 0.012; }
  return t;
};
window.__pickAt = pickAt;
window.__camera = camera;
window.__pickTest = () => {
  let ok = 0, n = 0;
  const bad = [];
  const v = new THREE.Vector3();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    world.tileCenter(x, y, v).project(camera);
    if (Math.abs(v.x) > 1 || Math.abs(v.y) > 1) continue;
    const t = pickAt((v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight);
    n++;
    if (t && t.x === x && t.y === y) ok++; else bad.push(`${x},${y}->${t ? t.x + ',' + t.y : 'null'}`);
  }
  return { tested: n, ok, bad: bad.slice(0, 12) };
};
addEventListener('pointermove', (e) => pickAt(e.clientX, e.clientY));

if (P.has('fade')) { const [fx, fy, fr] = P.get('fade').split(',').map(Number); world.setFoliageFade(fx, fy, fr); }

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const info = { calls: 0, triangles: 0 };
class InfoPass extends Pass {
  constructor() { super(); this.needsSwap = false; }
  render(r) { info.calls = r.info.render.calls; info.triangles = r.info.render.triangles; }
}
composer.addPass(new InfoPass());
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.85);
if (P.get('bloom') !== '0') composer.addPass(bloom);
composer.addPass(new OutputPass());
renderer.info.autoReset = false;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  setToonResolution(innerWidth, innerHeight, renderer.getPixelRatio());
});

const hud = document.getElementById('hud');
if (P.get('hud') === '0') hud.classList.add('hidden');
const timer = new THREE.Timer();
let frames = 0, measured = null;
function measure() {
  renderer.info.reset();
  renderer.render(scene, camera);
  const total = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.shadowMap.autoUpdate = false;
  renderer.info.reset();
  renderer.render(scene, camera);
  const main = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.shadowMap.autoUpdate = true;
  units.visible = false; hover.visible = false;
  scene.traverse((o) => { if (o.material === hlMat) o.visible = false; });
  renderer.info.reset();
  renderer.render(scene, camera);
  const worldOnly = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.shadowMap.autoUpdate = false;
  renderer.info.reset();
  renderer.render(scene, camera);
  const worldMain = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.shadowMap.autoUpdate = true;
  units.visible = true;
  scene.traverse((o) => { if (o.material === hlMat) o.visible = true; });
  measured = { map: mapDef.id, quality, buildMs: +buildMs.toFixed(1), worldStats: world.stats, sceneWithShadows: total, sceneMainPass: main, worldWithShadows: worldOnly, worldMainPass: worldMain };
  console.log('WORLD_STATS ' + JSON.stringify(measured));
  window.__stats = measured;
}
renderer.setAnimationLoop((now) => {
  timer.update(now);
  const dt = Math.min(timer.getDelta(), 0.05);
  const t = timer.getElapsed();
  world.update(dt, t, camera);
  if (frames === 45 && P.has('open')) for (const p of mapDef.props || []) if (p.type === 'chest' && world.hasChest(p.x, p.y)) world.openChest(p.x, p.y);
  if (frames === 45 && P.has('visit')) { const [vx, vy] = P.get('visit').split(',').map(Number); world.setVillageVisited(vx, vy); }
  renderer.info.reset();
  const f0 = performance.now();
  composer.render(dt);
  if (frames === 0) console.log(`FIRST_FRAME_MS ${(performance.now() - f0).toFixed(0)} (programs: ${renderer.info.programs.length})`);
  frames++;
  if (frames === 30) measure();
  if (frames % 15 === 0) {
    hud.textContent = `${mapDef.id}  env:${mapDef.environment}  q:${quality}  cam:${camMode}\n` +
      `build ${buildMs.toFixed(1)} ms   scene draws ${info.calls}  tris ${(info.triangles / 1000).toFixed(1)}k\n` +
      (measured ? `world-only: ${measured.worldMainPass.calls} draws main / ${measured.worldWithShadows.calls} incl. shadow` : '');
  }
});
</script>
</body>
</html>
