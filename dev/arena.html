<!doctype html>
<html><head><meta charset="utf-8"><title>Emberwing — battle arena stages</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px/1.3 system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;left:10px;top:8px;right:220px;color:#fff;text-shadow:0 1px 3px #000;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
#ui button{background:#0008;color:#fff;border:1px solid #fff5;border-radius:4px;padding:2px 7px;cursor:pointer;font:12px monospace}
#ui button.on{background:#c8803a;border-color:#ffd08a}
#ui .sep{width:100%;height:0}
#stats{position:fixed;right:10px;top:8px;color:#fff;text-shadow:0 1px 3px #000;text-align:right}
</style></head>
<body><div id="ui"></div><div id="stats"></div><script type="module">
// Arena stage viewer.  ?terrain=<TERRAIN char, URL-encoded>&preset=<ENV preset>&cam=wide|close|low|arc|high
//   &palette=temperate|autumn|ashen|desert|golden  &attacker=<TERRAIN char>  &quality=high|medium|low
//   &grade=0 (skip colour grade)  &ui=0 (hide UI)  &t=<time offset seconds>
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GradeShader } from '../src/core/postfx.js';
import { toonMaterial, addOutline, setToonResolution, toonGlobals } from '../src/gfx/toon.js';
import { ENV_PRESETS } from '../src/gfx/environment.js';

const q = new URLSearchParams(location.search);
const { Arena } = await import(q.get('mod') === 'tmp' ? '../src/gfx/arena-new.tmp.js' : '../src/gfx/arena.js');
let terrain = q.get('terrain') || '.';
let preset = q.get('preset') || 'day';
const palette = q.get('palette') || undefined;
const camMode = q.get('cam') || 'wide';
const tOffset = +(q.get('t') || 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
setToonResolution(innerWidth, innerHeight, renderer.getPixelRatio());

const t0 = performance.now();
const arena = new Arena(renderer, { terrain, preset, palette, attackerTerrain: q.get('attacker') || null, quality: q.get('quality') || 'high' });
const buildMs = performance.now() - t0;
window.__arena = arena;

function fighter(color, facing) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.42, 6, 16).translate(0, 0.45, 0), toonMaterial({ color }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 24, 16).translate(0, 0.93, 0), toonMaterial({ color: 0xf6d3b9 }));
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.03).translate(0, 0.35, 0), toonMaterial({ color: 0xdfe7f2 }));
  blade.position.set(0.28 * facing, 0.5, 0.12); blade.rotation.z = -0.5 * facing;
  for (const m of [body, head, blade]) { m.castShadow = true; m.receiveShadow = true; addOutline(m, { width: 2 }); g.add(m); }
  return g;
}
const left = fighter(0xb3262f, 1);
const right = fighter(0x2c4c9e, -1);
arena.scene.add(left, right);
function placeFighters() { left.position.copy(arena.leftSpot); right.position.copy(arena.rightSpot); }
placeFighters();

const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 32), innerWidth / innerHeight, 0.1, 400);
const CAMS = {
  wide: [[0, 1.25, 7.4], [0, 0.8, 0]],
  close: [[1.0, 1.0, 4.2], [0.6, 0.8, 0]],
  low: [[2.2, 0.6, 3.6], [-0.8, 1.0, 0]],
  arc: [[5.2, 1.5, 5.6], [0, 0.8, 0]],
  arcl: [[-5.4, 1.3, 5.2], [0, 0.8, 0]],
  high: [[0, 3.4, 8.8], [0, 0.5, 0]],
  start: [[0, 1.5, 9.5], [0, 0.8, 0]],
};
const [cp, cl] = CAMS[camMode] || CAMS.wide;
camera.position.fromArray(cp); camera.lookAt(new THREE.Vector3().fromArray(cl));

const size = renderer.getDrawingBufferSize(new THREE.Vector2());
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(size.x, size.y, { type: THREE.HalfFloatType, samples: 4 }));
const renderPass = new RenderPass(arena.scene, camera);
let sceneCalls = 0, sceneTris = 0;
const rpRender = renderPass.render.bind(renderPass);
renderPass.render = (...a) => { const c0 = renderer.info.render.calls, t0 = renderer.info.render.triangles; rpRender(...a); sceneCalls = renderer.info.render.calls - c0; sceneTris = renderer.info.render.triangles - t0; };
renderer.info.autoReset = false;
composer.addPass(renderPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(size.x / 2, size.y / 2), 0.4, 0.4, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass(GradeShader);
grade.uniforms.uGrain.value = 0;
grade.enabled = q.get('grade') !== '0';
composer.addPass(grade);
function applyPost(p) {
  renderer.toneMappingExposure = p.exposure;
  bloom.strength = p.bloomStrength; bloom.threshold = p.bloomThreshold; bloom.radius = p.bloomRadius ?? 0.4;
  grade.uniforms.uSaturation.value = p.saturation; grade.uniforms.uContrast.value = p.contrast;
  grade.uniforms.uVignette.value = p.vignette; grade.uniforms.uTint.value.set(...p.tint);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  composer.setSize(innerWidth, innerHeight);
  setToonResolution(innerWidth, innerHeight, renderer.getPixelRatio());
});

const ui = document.getElementById('ui');
const stats = document.getElementById('stats');
if (q.get('ui') === '0') { ui.style.display = 'none'; stats.style.display = 'none'; }
const tBtns = {}, pBtns = {};
const refresh = () => {
  for (const k in tBtns) tBtns[k].classList.toggle('on', k === terrain);
  for (const k in pBtns) pBtns[k].classList.toggle('on', k === preset);
};
for (const ch of ['.', '"', ',', 'B', 'Y', 'W', 'V', 'F', 'P', 'H', 'M', 'C', 'c', 'T', 'G', 'S', 'D', 'R', '=', 'g', 'A', 'L', 'X']) {
  const b = document.createElement('button'); b.textContent = ch;
  b.onclick = () => { terrain = ch; const t = performance.now(); arena.setTerrain(terrain, preset, palette); placeFighters(); console.log('setTerrain', ch, (performance.now() - t).toFixed(1) + 'ms'); refresh(); };
  tBtns[ch] = b; ui.appendChild(b);
}
ui.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
for (const name of Object.keys(ENV_PRESETS)) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { preset = name; arena.setTerrain(terrain, preset, palette); refresh(); };
  pBtns[name] = b; ui.appendChild(b);
}
refresh();

const timer = new THREE.Timer();
timer.connect(document);
let frames = 0, acc = 0;
renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  const dt = timer.getDelta();
  const el = timer.getElapsed() + tOffset;
  toonGlobals.time.value = el;
  arena.update(dt, el, camera);
  left.position.y = arena.leftSpot.y + Math.abs(Math.sin(el * 2.2)) * 0.03;
  right.position.y = arena.rightSpot.y + Math.abs(Math.sin(el * 2.2 + 1)) * 0.03;
  applyPost(arena.grade);
  renderer.info.reset();
  composer.render(dt);
  frames++; acc += dt;
  if (acc > 0.5) {
    stats.textContent = `${arena.theme}/${arena.variant} · ${arena.env.name} · ${(frames / acc).toFixed(0)} fps · scene draw calls ${sceneCalls} · ${(sceneTris / 1000).toFixed(0)}k tris · build ${buildMs.toFixed(0)}ms`;
    frames = 0; acc = 0;
  }
});
window.__stats = () => ({ calls: sceneCalls, tris: sceneTris, buildMs });
</script></body></html>
