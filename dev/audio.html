<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Emberwing Knights — audio lab</title>
<style>
  body { margin: 0; padding: 16px 20px; background: #15131c; color: #e9e4d8; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  h2 { font-size: 13px; margin: 18px 0 6px; color: #f0c46c; text-transform: uppercase; letter-spacing: .08em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { background: #2a2636; color: #e9e4d8; border: 1px solid #4a4260; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #3a3350; }
  button.on { background: #6b431a; border-color: #f0c46c; }
  label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
  #status { margin: 6px 0 10px; color: #b9b2a3; }
  #summary { margin: 4px 0 8px; font-weight: 600; }
  table { border-collapse: collapse; font: 12px/1.35 ui-monospace, Consolas, monospace; }
  td, th { padding: 1px 10px 1px 0; text-align: left; }
  th { color: #b9b2a3; font-weight: 600; }
  .ok { color: #8fd18f; }
  .fail { color: #ff7a6b; }
  .cols { columns: 2 420px; }
</style>
</head>
<body>
<h1>Emberwing Knights — audio lab</h1>
<div id="status">Press any button to start audio. The offline self-test runs on load.</div>
<div class="row">
  <label>Music <input id="musicVol" type="range" min="0" max="1" step="0.01"></label>
  <label>SFX <input id="sfxVol" type="range" min="0" max="1" step="0.01"></label>
  <label><input id="mute" type="checkbox"> Mute</label>
  <button id="stop">Stop music</button>
  <button id="duck">Duck</button>
</div>
<h2>Music</h2>
<div class="row" id="tracks"></div>
<h2>Sound effects</h2>
<div class="row" id="effects"></div>
<h2>Self-test (OfflineAudioContext)</h2>
<div id="summary">running…</div>
<div class="cols"><table id="results"><tr><th>kind</th><th>name</th><th>peak</th><th>rms</th><th>result</th></tr></table></div>

<script type="module">
import { audio, TRACKS, SFX, renderOffline } from '../src/audio/audio.js';
import { getTrack } from '../src/audio/tracks.js';

window.audio = audio;
const $ = (id) => document.getElementById(id);

function button(parent, label, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', onClick);
  parent.appendChild(b);
  return b;
}

const trackButtons = new Map();
for (const name of TRACKS) {
  const t = getTrack(name);
  const b = button($('tracks'), name, () => audio.init().then(() => audio.playMusic(name, { restart: true })));
  b.title = `${t.key}, ${t.bpm} bpm, loop ${(t.body.beats * t.spb).toFixed(1)} s${t.once ? ' (one-shot)' : ''}`;
  trackButtons.set(name, b);
}
for (const name of SFX) button($('effects'), name, () => audio.init().then(() => audio.sfx(name)));

$('musicVol').value = audio.musicVolume;
$('sfxVol').value = audio.sfxVolume;
$('musicVol').addEventListener('input', (e) => audio.setMusicVolume(+e.target.value));
$('sfxVol').addEventListener('input', (e) => audio.setSfxVolume(+e.target.value));
$('mute').addEventListener('change', (e) => audio.setMuted(e.target.checked));
$('stop').addEventListener('click', () => audio.stopMusic());
$('duck').addEventListener('click', () => audio.init().then(() => audio.duck(0.6, 0.8)));

setInterval(() => {
  const cur = audio.currentTrack;
  $('status').textContent = `now playing: ${cur ?? '—'}   music ${audio.musicVolume.toFixed(2)}   sfx ${audio.sfxVolume.toFixed(2)}${audio.muted ? '   (muted)' : ''}`;
  for (const [name, b] of trackButtons) b.classList.toggle('on', name === cur);
}, 200);

function analyse(buffer, from, to) {
  const a = Math.floor(from * buffer.sampleRate);
  const b = Math.min(buffer.length, Math.ceil(to * buffer.sampleRate));
  let peak = 0, sum = 0;
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    const d = buffer.getChannelData(c);
    for (let i = a; i < b; i++) {
      const v = d[i];
      const abs = v < 0 ? -v : v;
      if (abs > peak) peak = abs;
      sum += v * v;
    }
  }
  return { peak, rms: Math.sqrt(sum / Math.max(1, (b - a) * buffer.numberOfChannels)) };
}

function addRow(r) {
  const tr = document.createElement('tr');
  const good = r.flags.length === 0;
  for (const text of [r.kind, r.name, r.peak.toFixed(3), r.rms.toFixed(4), good ? 'OK' : r.flags.join(' ')]) {
    const td = document.createElement('td');
    td.textContent = text;
    tr.appendChild(td);
  }
  tr.lastChild.className = good ? 'ok' : 'fail';
  $('results').appendChild(tr);
}

async function selfTest() {
  const started = performance.now();
  let lint = 0;
  for (const name of TRACKS) for (const w of getTrack(name).warnings) { console.warn('LINT', w); lint++; }
  const jobs = [...TRACKS.map((n) => ['music', n]), ...SFX.map((n) => ['sfx', n])];
  const results = new Array(jobs.length);
  let next = 0;
  const worker = async () => {
    while (next < jobs.length) {
      const i = next++;
      const [kind, name] = jobs[i];
      try {
        const { buffer, from, to } = await renderOffline(kind, name, { seconds: 6 });
        const { peak, rms } = analyse(buffer, from, to);
        const flags = [];
        if (!(rms >= 0.002)) flags.push('SILENT');
        if (!(peak <= 1.0)) flags.push('CLIP');
        results[i] = { kind, name, peak, rms, flags };
      } catch (err) {
        results[i] = { kind, name, peak: NaN, rms: NaN, flags: [`ERROR ${err.message}`] };
      }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  let ok = 0, fail = 0;
  for (const r of results) {
    const good = r.flags.length === 0;
    if (good) ok++; else fail++;
    console.log(`SELFTEST ${r.kind.padEnd(5)} ${r.name.padEnd(11)} peak=${r.peak.toFixed(3)} rms=${r.rms.toFixed(4)} ${good ? 'OK' : r.flags.join(' ')}`);
    addRow(r);
  }
  console.log(`selftest: ${jobs.length} renders in ${((performance.now() - started) / 1000).toFixed(1)} s, lint warnings=${lint}`);
  const done = `AUDIO SELFTEST DONE ok=${ok} fail=${fail}`;
  $('summary').textContent = done;
  $('summary').className = fail ? 'fail' : 'ok';
  window.selftestResult = { ok, fail, lint, results };
  console.log(done);
}

selfTest();
</script>
</body>
</html>
